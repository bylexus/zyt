<!DOCTYPE html>
<html manifest="manifest.appcache">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
  <title>Zyt - Stylish Clock</title>
  <meta name="Description"
    content="Eine stylische Uhr, welche die Zeit in Worten anzeigt. Ideal als Wand-Panel oder Webseiten-Widget." />
  <link href="./dist/zyt.css" rel="stylesheet" type="text/css" />
  <style>
    html,
    body {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: auto;
    }

    body {
      font-family: "Helvetica Neue", "Helvetica", sans-serif;
      background-color: white;
    }

    #app1,
    #app2,
    #app3,
    #app4 {
      flex-grow: 1;
      flex-shrink: 1;
      flex-basis: 0;
    }
  </style>
</head>

<body>
  <h1>Zyt - Stylish Clock - Demos</h1>
  <div style="padding: 10px;height: 400px; display: flex;gap: 10px;">
    <div id="app1"></div>
    <div id="app2"></div>
  </div>
  <div style="padding: 10px;height: 400px; display: flex;gap: 10px;">
    <div id="app3"></div>
    <div id="app4"></div>
  </div>

  <script type="module">
    import Zyt from './dist/zyt.js';
    Zyt('#app1', 'clock1', {
      disableSettings: true,
      bgColor1: '#333',
    });
    Zyt('#app2', 'clock2');
    Zyt('#app3', 'clock3');
    Zyt('#app4', 'clock4');
  </script>
</body>

</html>
