<!DOCTYPE html>
<html manifest="manifest.appcache">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
  <title>Zyt - Stylish Clock</title>
  <meta name="Description"
    content="Eine stylische Uhr, welche die Zeit in Worten anzeigt. Ideal als Wand-Panel oder Webseiten-Widget." />
  <meta name="author" content="alex alex@alexi.ch" />
  <link href="./zyt.css" rel="stylesheet" type="text/css" />
  <link href="./site.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="app"></div>

  <script type="module">
    import Zyt from './zyt.js';

    const params = queryParams() || {};

    Zyt('#app', 'zyt.alexi.ch', {
      clockSettings: {
        ...params,
        disableSettings: false
      },
      fonts:
        [
          { displayName: "Audiowide", fontFamily: "Audiowide" },
          { displayName: "Black Ops One", fontFamily: "Black Ops One" },
          { displayName: "Bree Serif", fontFamily: "Bree Serif" },
          { displayName: "Bungee Inline", fontFamily: "Bungee Inline" },
          { displayName: "Crushed", fontFamily: "Crushed" },
          { displayName: "Faster One", fontFamily: "Faster One" },
          { displayName: "Libre Baskerville", fontFamily: "Libre Baskerville" },
          { displayName: "Macondo Swash Caps", fontFamily: "Macondo Swash Caps" },
          { displayName: "Merienda One", fontFamily: "Merienda One" },
          { displayName: "monospace", fontFamily: "monospace" },
          { displayName: "Monoton", fontFamily: "Monoton" },
          { displayName: "Montserrat", fontFamily: "Montserrat" },
          { displayName: "Roboto Mono", fontFamily: "Roboto Mono" },
          { displayName: "sans-serif", fontFamily: "sans-serif" },
          { displayName: "serif", fontFamily: "serif" },
          { displayName: "Spicy Rice", fontFamily: "Spicy Rice" },
          { displayName: "Stardos Stencil", fontFamily: "Stardos Stencil" },
          { displayName: "Syncopate", fontFamily: "Syncopate" },
          { displayName: "Ubuntu", fontFamily: "Ubuntu" },
          { displayName: "Ultra", fontFamily: "Ultra" },
          { displayName: "Wallpoet", fontFamily: "Wallpoet" },
        ]
    });

    function queryParams() {
      const params = location.search.replace(/^\?/, "").split("&").map((str) => {
        const parts = str.split("=");
        return {
          key: decodeURIComponent(parts[0]),
          value: decodeURIComponent(parts[1]),
        };
      });

      const obj = {};
      for (const param of params) {
        obj[param.key] = param.value;
      }
      return obj;
    }
  </script>
</body>

</html>
